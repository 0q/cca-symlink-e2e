name: CCA hosted confirmation

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run stock Claude Code Action
        uses: anthropics/claude-code-action@6c690188da61cf16ee7debb28383ba67f02abb4c
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          settings: '{"permissions":{"deny":["Read(./.git/**)"]}}'
